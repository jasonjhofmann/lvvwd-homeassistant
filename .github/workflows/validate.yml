name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 = the declared support floor (HA 2025.11 -> Python 3.13). The
        # floor leg catches 3.14-only syntax before it ships (see pyproject's
        # ruff target-version note).
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements_test.txt
      - run: pytest tests -q --cov=custom_components.lvvwd --cov-fail-under=80

  pii-gate:
    # Fail the build if any known-private token leaks into the public tree.
    # Patterns are assembled from fragments so this workflow file is not itself
    # a match (and so the forbidden literals never appear in the repo).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tree for private account/owner tokens
        run: |
          set -u
          # Build forbidden patterns from concatenated halves — never written
          # whole anywhere in the repo, including in this gate.
          patterns=(
            "6026""115368"
            "Ul""lom"
            "0678""563"
            "Jason""Hofmann"
            "HOF""MANN"
            "791""\.38"
            "1497""\.15"
            "268""\.30"
            "289""\.96"
            "516""\.92"
          )
          rc=0
          for p in "${patterns[@]}"; do
            # Exclude the VCS dir and this very workflow from the scan.
            if grep -RInE --binary-files=without-match \
                 --exclude-dir=.git \
                 --exclude="validate.yml" \
                 -- "$p" . ; then
              echo "::error::PII pattern matched in tree: ${p}"
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "PII gate FAILED — a private token leaked into the public repo."
            exit 1
          fi
          echo "PII gate passed — no private tokens found."

  # Proves the floor declared in hacs.json is real. The other gates resolve
  # the LATEST Home Assistant, so code could start depending on a newer API
  # while HACS keeps offering the release to users on the declared floor.
  # Reads the floor from hacs.json and the integration's own requirements
  # from manifest.json, then imports every module against that exact release.
  #
  # mypy runs here in its default (non-strict) mode: this integration has no
  # mypy configuration, but even the default mode catches what an import
  # cannot, such as a TypedDict key the floor's Home Assistant doesn't have
  # (the unit_class bug fixed in 0.2.0).
  minimum-supported-ha:
    name: Minimum supported HA (hacs.json floor)
    runs-on: ubuntu-latest
    env:
      # Must satisfy the floor's requires-python (HA 2025.11 = Python 3.13).
      FLOOR_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Recreates the environment the floor release actually shipped into.
      # Every package resolves as of the floor's PyPI release date (+1 day),
      # via UV_EXCLUDE_NEWER: HA pins its direct dependencies but not theirs,
      # and a fresh resolve drifts (HA 2025.6 pins aiodns 3.4.0 but not
      # pycares, and pycares 5 removed an API aiodns uses). HA's own exact
      # pins are also restated as direct requirements, because uv installs a
      # since-yanked version only when it is pinned directly (HA 2025.3.0
      # pins aiohttp 3.11.13, yanked later). An integration requirement
      # released after the floor would need --exclude-newer-package.
      - name: Pin the floor and the integration's requirements
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request
          floor = json.load(open("hacs.json"))["homeassistant"]
          reqs = json.load(open("custom_components/lvvwd/manifest.json"))["requirements"]
          url = f"https://pypi.org/pypi/homeassistant/{floor}/json"
          meta = json.load(urllib.request.urlopen(url))
          released = min(
              dt.datetime.fromisoformat(u["upload_time_iso_8601"].replace("Z", "+00:00"))
              for u in meta["urls"]
          )
          cutoff = (released + dt.timedelta(days=1)).strftime("%Y-%m-%dT%H:%M:%SZ")
          pins = [
              r for r in meta["info"]["requires_dist"] or [] if "==" in r and ";" not in r
          ]
          with open("floor-requirements.txt", "w") as f:
              lines = [f"homeassistant=={floor}", *pins, "voluptuous", *reqs]
              f.write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"UV_EXCLUDE_NEWER={cutoff}\n")
          print(f"Declared Home Assistant floor: {floor} (released {released:%Y-%m-%d}); "
                f"{len(pins)} HA pins restated; requirements: {reqs}; "
                f"resolving as of {cutoff}")
          PY

      - name: Import every module against the floor
        run: |
          uv run --no-project --python "$FLOOR_PYTHON" \
            --with-requirements floor-requirements.txt \
            python -c "
          import importlib, pkgutil
          import custom_components.lvvwd as pkg
          names = [m.name for m in pkgutil.iter_modules(pkg.__path__)]
          for name in names:
              importlib.import_module(f'{pkg.__name__}.{name}')
          print(f'{len(names)} modules import on the declared floor')
          "

      - name: Mypy against the floor
        run: |
          uv run --no-project --python "$FLOOR_PYTHON" \
            --with-requirements floor-requirements.txt \
            --with mypy \
            --with types-requests \
            mypy custom_components/lvvwd/
